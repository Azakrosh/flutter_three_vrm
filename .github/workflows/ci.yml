name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check and build web runtime
        working-directory: web
        run: |
          pnpm typecheck
          pnpm test
          pnpm verify:contract
          pnpm build
          pnpm verify:build
      - name: Verify redistributable example assets
        run: node tool/verify_example_assets.mjs
      - name: Verify public documentation contract
        run: node tool/verify_public_docs.mjs
      - name: Verify generated runtime is committed
        run: git diff --exit-code -- assets/web/dist
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Verify Git consumer package boundary
        env:
          CONSUMER_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
          CONSUMER_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node tool/verify_git_consumer.mjs --repository "$CONSUMER_REPOSITORY" --ref "$CONSUMER_REF"
      - name: Analyze
        run: flutter analyze
      - name: Validate API documentation
        run: dart doc --dry-run .
      - name: Test
        run: flutter test
      - name: Build Android debug example
        working-directory: example
        run: flutter build apk --debug
      - name: Build Android release app bundle
        working-directory: example
        run: flutter build appbundle --release

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check Firebase Test Lab tooling syntax
        shell: pwsh
        run: |
          foreach ($file in @(
            'tool/firebase_test_lab.ps1',
            'tool/firebase_soak_evidence.ps1',
            'tool/run_firebase_soak.ps1',
            'tool/test_firebase_test_lab.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file`: $($_.Message)" }
              exit 1
            }
          }
          & ./tool/test_firebase_test_lab.ps1
      - name: Build Windows release example
        working-directory: example
        run: flutter build windows --release
      - name: Run Windows runtime smoke test
        working-directory: example
        run: flutter test integration_test/runtime_smoke_test.dart -d windows
