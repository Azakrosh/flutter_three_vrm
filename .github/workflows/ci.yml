name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check and build web runtime
        working-directory: web
        run: |
          pnpm typecheck
          pnpm test
          pnpm verify:contract
          pnpm build
          pnpm verify:build
      - name: Verify redistributable example assets
        run: node tool/verify_example_assets.mjs
      - name: Verify generated runtime is committed
        run: git diff --exit-code -- assets/web/dist
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android example
        working-directory: example
        run: flutter build apk --debug

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check Firebase Test Lab tooling syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tool/run_firebase_soak.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Build Windows example
        working-directory: example
        run: flutter build windows --debug
      - name: Run Windows runtime smoke test
        working-directory: example
        run: flutter test integration_test/runtime_smoke_test.dart -d windows
