name: flutter_three_vrm
description: A production-oriented VRM avatar runtime for Flutter on Android and Windows.
version: 0.2.0-dev.1
publish_to: none

platforms:
  android:
  windows:

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1
  webview_flutter_windows: ^1.2.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.flutter_three_vrm
        pluginClass: FlutterThreeVrmPlugin
  assets:
    - assets/web/
    - assets/web/css/
    - assets/web/dist/
