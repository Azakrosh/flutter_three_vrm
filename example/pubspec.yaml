name: example
description: "Example application demonstrating flutter_three-vrm AI Vtuber features."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_three_vrm:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vrm/
    - assets/vrma/
    - assets/images/
    - assets/images/backgrounds/

